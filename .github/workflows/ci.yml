name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks the pull requests on top of one
  # another, and a filter on `main` left every intermediate level without any
  # gate -- only the secret scanner ran.
  pull_request:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `pnpm run checks` covers typecheck, lint, format, knip, the node:test
  # suite (the module builds once, inside `pnpm test`), size, ratchet and sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        packages/dms-automation/README.md
        packages/dms-automation/docs
        packages/interface-dms-automation/README.md
        packages/interface-dms-automation/docs
      docs-typescript-project: packages/interface-dms-automation/docs/tsconfig.json
      # Asserts the exports map still describes the dist `pnpm test` built.
      extra-commands: pnpm --dir packages/interface-dms-automation check:exports
      renovate-sync: false
      # Frontend build/typecheck run in the consuming generated Inertia
      # workspace, where the host DMS composables and SDK aliases resolve.
    permissions:
      contents: read

  formal-leader-triggers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/formal-leader-triggers/check.mjs

  # The main and next rulesets require a check named `ubuntu`; a called
  # workflow reports as `ci / Node .nvmrc`.
  ubuntu:
    if: always()
    needs: [ci, formal-leader-triggers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
