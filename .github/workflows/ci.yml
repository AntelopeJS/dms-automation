name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `pnpm run checks` covers typecheck, lint, format, knip, the node:test
  # suite (the module builds once, inside `pnpm test`), size, ratchet and sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms-automation/README.md
        packages/dms-automation/docs
        packages/interface-dms-automation/README.md
        packages/interface-dms-automation/docs
      docs-typescript-project: packages/interface-dms-automation/docs/tsconfig.json
      # Asserts the exports map still describes the dist `pnpm test` built.
      extra-commands: pnpm --dir packages/interface-dms-automation check:exports
      renovate-sync: false
      test-job: true
      # Frontend build/typecheck run in the consuming generated Inertia
      # workspace, where the host DMS composables and SDK aliases resolve.
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so this copies its tier rule for the jobs
  # declared here: a draft and the next to main pull request skip them.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          case "$EVENT" in
            pull_request)
              if [[ "$BASE_REF" == "$DEFAULT_BRANCH" && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$HEAD_REF" =~ ^(next|develop)$ ]]; then
                tier=none
              elif [[ "$DRAFT" == true ]]; then
                tier=draft
              elif [[ "$BASE_REF" == "$DEFAULT_BRANCH" ]]; then
                tier=full
              else
                tier=fast
              fi
              ;;
            push)
              if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then tier=none; else tier=full; fi
              ;;
            schedule) tier=nightly ;;
            *) tier=full ;;
          esac
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`" >> "$GITHUB_STEP_SUMMARY"

  formal-leader-triggers:
    needs: select
    if: needs.select.outputs.tier != 'none' && needs.select.outputs.tier != 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          # The runner replays a TLC result whose inputs it already checked:
          # key on those inputs so a model change saves its new result.
          key: formal-${{ hashFiles('.agents/skills/formal-leader-triggers/**', 'pnpm-lock.yaml') }}
          restore-keys: formal-
      - run: node .agents/skills/formal-leader-triggers/check.mjs

  # The main and next rulesets require a check named `ubuntu`; a called
  # workflow reports as `ci / Node .nvmrc`. A draft pull request fails it, so
  # merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, formal-leader-triggers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped'
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
