name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Run the nightly tier, with the Windows jobs and Stress
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `pnpm run checks` covers typecheck, lint, format, knip, the node:test
  # suite (the module builds once, inside `pnpm test`), size, ratchet and sync.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms-automation/README.md
        packages/dms-automation/docs
        packages/interface-dms-automation/README.md
        packages/interface-dms-automation/docs
      docs-typescript-project: packages/interface-dms-automation/docs/tsconfig.json
      # Asserts the exports map still describes the dist `pnpm test` built.
      extra-commands: pnpm --dir packages/interface-dms-automation check:exports
      renovate-sync: false
      test-job: true
      affected-tests: true
      nightly: ${{ inputs.nightly == true }}
      # Frontend build/typecheck run in the consuming generated Inertia
      # workspace, where the host DMS composables and SDK aliases resolve.
    permissions:
      contents: read

  # ci-node.yml exposes no outputs, so the shared ci-tier action picks the tier
  # for the jobs declared here: a draft and the next to main pull request skip them.
  select:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      e2e: ${{ steps.e2e.outputs.suite }}
      shards: ${{ steps.e2e.outputs.shards }}
    steps:
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      # A pull request runs the @smoke journeys, or every journey with the
      # ci:full label; the merge queue, the nightly run and a dispatch run
      # every journey over four shards.
      - name: Pick the journeys the e2e job runs
        id: e2e
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          case "$TIER/$EVENT/$FULL_LABEL" in
            none/* | draft/*) suite=none ;;
            */pull_request/true) suite=full ;;
            */pull_request/* | */push/*) suite=smoke ;;
            *) suite=full ;;
          esac
          if [[ "$suite" == full ]]; then shards='[1, 2, 3, 4]'; else shards='[1]'; fi
          echo "suite=${suite}" >> "$GITHUB_OUTPUT"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  formal-leader-triggers:
    needs: select
    if: needs.select.outputs.tier != 'none' && needs.select.outputs.tier != 'draft'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/antelopejs-formal
          # The runner replays a TLC result whose inputs it already checked:
          # key on those inputs so a model change saves its new result.
          key: formal-${{ hashFiles('.agents/skills/formal-leader-triggers/**', 'pnpm-lock.yaml') }}
          restore-keys: formal-
      - run: node .agents/skills/formal-leader-triggers/check.mjs

  # The journeys of e2e/ as a Playwright suite, the set `select` picks:
  # the @smoke ones, or every journey over the shards of the matrix.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      SUITE: ${{ needs.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run e2e:build
      - run: echo "DMS_E2E_PREBUILT=1" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            e2e/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/*/pnpm-lock.yaml', 'e2e/playground/antelope.config.ts') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: dms-e2e-frontend-${{ github.sha }}
          restore-keys: dms-e2e-frontend-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: env.SUITE == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: env.SUITE == 'full'
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      - if: success() || failure()
        run: pnpm exec tsc --noEmit -p e2e
      - if: always() && env.SUITE == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # The journeys that only call the API or run commands, as node:test
  # integration tests on the kit's startRun(), wherever every journey runs.
  journeys:
    needs: select
    if: needs.select.outputs.e2e == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run e2e:build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            e2e/playground/.antelope/cache
          key: journeys-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/*/pnpm-lock.yaml', 'e2e/playground/antelope.config.ts') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/dms-e2e/frontend
          key: dms-e2e-frontend-${{ github.sha }}
          restore-keys: dms-e2e-frontend-
      - run: node --test --test-isolation=none --test-shard=${{ matrix.shard }}/${{ strategy.job-total }} e2e/integration/*.journeys.test.mjs
        env:
          DMS_E2E_PREBUILT: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journeys-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of the shards of a full run.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.e2e == 'full'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The main and next rulesets require a check named `ubuntu`; a called
  # workflow reports as `ci / Node .nvmrc`. A draft pull request fails it, so
  # merge-when-green cannot merge on the draft run.
  ubuntu:
    if: always()
    needs: [select, ci, formal-leader-triggers, e2e, journeys, e2e-report]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped') || (needs.select.outputs.e2e == 'full' && needs.journeys.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
  verdict:
    needs:
      - ci
      - select
      - formal-leader-triggers
      - e2e
      - journeys
      - e2e-report
      - ubuntu
      - renovate-sync
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
