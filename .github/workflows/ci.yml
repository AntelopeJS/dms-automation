name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks the pull requests on top of one
  # another, and a filter on `main` left every intermediate level without any
  # gate -- only the secret scanner ran.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Before setup-node: its pnpm cache needs the package manager on PATH.
      # The version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the version of record. oxlint needs at least 22.18 to
          # read a TypeScript config, which every value there clears.
          node-version-file: .nvmrc
          cache: pnpm
          # frontend-vue is its own project with its own lockfile; without it
          # the cache key ignores half of what the job installs.
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dms-automation/frontend-vue/pnpm-lock.yaml

      # The whole workspace, root included: the shared oxlint, oxfmt and
      # TypeScript configs live there and the packages extend them.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/dms-automation/frontend-vue install --frozen-lockfile

      # Interface first: it is the contract, and the module builds against it.
      - run: pnpm --dir packages/interface-dms-automation lint
      - run: pnpm --dir packages/interface-dms-automation typecheck
      - run: pnpm --dir packages/interface-dms-automation knip
      - run: pnpm --dir packages/interface-dms-automation build
      # Asserts the exports map still describes the built output.
      - run: pnpm --dir packages/interface-dms-automation check:exports

      - run: pnpm --dir packages/dms-automation lint
      # oxlint's type-aware pass degrades to `any` on a broken tsconfig
      # without failing, so the typecheck is what catches it.
      - run: pnpm --dir packages/dms-automation typecheck
      # Unused dependencies only. `pnpm knip:all` also reports dead files and
      # exports, which need a human to confirm, so they stay out of the gate.
      - run: pnpm --dir packages/dms-automation knip
      - run: pnpm --dir packages/dms-automation build
      - run: pnpm --dir packages/dms-automation test:frontend-registration
      - run: pnpm --dir packages/dms-automation test:release-script
      # Contract test on the interface-core internals type attribution reads.
      # A release that moves the RegisteringProxy bookkeeping again must fail
      # here rather than silently flatten the builder palette.
      - run: pnpm --dir packages/dms-automation test:type-origin
      # Frontend build/typecheck run in the consuming generated Inertia
      # workspace, where the host DMS composables and SDK aliases resolve.
